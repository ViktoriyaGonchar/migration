# Канонический baseline: app + bot в одной Docker-сети, БД только у app.
#
# Файл .env в корне репозитория обязателен для compose (скопируйте из .env.example и заполните).
# Минимальный .env.example не содержит DATABASE_URL и INTERNAL_API_BASE_URL: их для контейнеров
# задаёт этот файл (см. environment у сервисов app, migrate и bot). Не дублируйте их в .env без нужды.
#
# ВАЖНО — reverse proxy (production):
# - В WAN открывайте только reverse proxy (443/80). Пример: Caddy/Traefik/nginx на хосте или отдельном контейнере
#   с upstream на app:8000 по внутренней сети (тот же bridge или attachable network).
# - Сервис app НЕ публикует порт на хост (нет секции ports). Доступ снаружи только через proxy + TLS.
# - Для production добавьте в .env (см. .env.full.example): BASE_URL=https://ваш-домен, COOKIE_SECURE=true;
#   INTERNAL_API_KEY одинаковый для app и bot. INTERNAL_API_BASE_URL для сервиса bot задаётся ниже в compose.
#
# Порядок первого запуска:
# 1. Скопировать .env.example → .env, заполнить секреты.
# 2. Миграции: docker compose --profile migrate run --rm migrate
# 3. Запуск: docker compose up -d app bot
# 4. Настроить proxy на app:8000 (если proxy вне этого файла).

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file:
      - .env
    environment:
      # Абсолютный путь к SQLite на томе (четыре слеша после схемы — требование URL для Unix-пути).
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
    volumes:
      - sqlite_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    env_file:
      - .env
    environment:
      # Docker DNS: сервис app → внутренний IP. Не подставляйте сюда публичный URL — только внутренняя сеть.
      INTERNAL_API_BASE_URL: http://app:8000
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  migrate:
    profiles:
      - migrate
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
    volumes:
      - sqlite_data:/data
    networks:
      - backend
    entrypoint: ["/usr/local/bin/app-entrypoint.sh"]
    command: ["alembic", "upgrade", "head"]
    restart: "no"

networks:
  backend:
    driver: bridge

volumes:
  sqlite_data:
