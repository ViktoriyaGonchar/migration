[project]
name = "migration-compass-backend"
version = "0.1.0"
description = "First-pass: gated site + auth + SQLAdmin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "passlib[bcrypt]>=1.7.4",
    "sqladmin>=0.20.0",
    "itsdangerous>=2.2.0",
    "typer>=0.15.0",
    "python-multipart>=0.0.17",
    "aiogram>=3.13.0",
    "httpx>=0.28.0",
]

[project.scripts]
mc-cli = "app.cli:main"
mc-bot = "bot.main:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "bot*"]
